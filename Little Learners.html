<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb347">
<title>Little Learners</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<style>
:root{--bg:#fff8e7;--ink:#222;--card:#ffffff;--accent:#ff6b6b;--good:#8ce99a;--shadow:rgba(0,0,0,.15)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d2540;--ink:#ffffff;--card:#2b3558;--accent:#ffb347;--good:#2f9e44;--shadow:rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
h1{text-align:center;font-size:clamp(26px,7vw,40px);margin:6px 0 10px}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
button{font:inherit;border:none;border-radius:22px;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.tab{background:var(--card);padding:12px 18px;font-size:18px;box-shadow:0 4px 0 var(--shadow)}
.tab.on{background:var(--accent);color:#fff}
#stage{max-width:540px;margin:0 auto;text-align:center}
.pic{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;min-height:170px;font-size:min(28vw,150px);line-height:1.15;background:var(--card);border-radius:28px;padding:18px;box-shadow:0 6px 0 var(--shadow);cursor:pointer;user-select:none}
.prompt{font-size:clamp(24px,6.5vw,38px);font-weight:bold;margin:16px 0 4px}
.listen{background:var(--card);padding:8px 16px;font-size:16px;box-shadow:0 3px 0 var(--shadow)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.choice{font-size:min(15vw,70px);background:var(--card);padding:12px 0;box-shadow:0 5px 0 var(--shadow);transition:transform .1s}
.choice:active{transform:translateY(3px)}
.choice.right{background:var(--good)}
.choice.wrong{opacity:.35}
.choice.txt{font-size:clamp(15px,4.2vw,20px);font-weight:bold;padding:18px 6px;line-height:1.3}
.msg{font-size:clamp(22px,6vw,30px);font-weight:bold;min-height:44px;margin-top:12px;white-space:pre-line;line-height:1.4}
.next{background:var(--accent);color:#fff;padding:14px 28px;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.2);margin-top:6px}
.next[hidden]{display:none}
.score{font-size:20px;margin-top:6px}
</style>
</head>
<body>
<h1>🌈 Little Learners 🌈</h1>
<nav>
  <button class="tab on" data-mode="animals">🐶 Animals</button>
  <button class="tab" data-mode="numbers">🔢 Numbers</button>
  <button class="tab" data-mode="letters">🔤 Letters</button>
  <button class="tab" data-mode="routine">🌞 Daily Routine</button>
</nav>

<div id="stage">
  <div class="pic" id="pic" title="Tap to hear"></div>
  <div class="prompt" id="prompt"></div>
  <button class="listen" id="listen">🔊 Listen</button>
  <div class="choices" id="choices"></div>
  <div class="msg" id="msg"></div>
  <button class="next" id="next" hidden>Next ➜</button>
  <div class="score">⭐ Stars: <span id="score">0</span></div>
</div>

<script>
const ANIMALS = [
  {e:"🐶", w:"Dog"}, {e:"🐱", w:"Cat"}, {e:"🐮", w:"Cow"}, {e:"🐷", w:"Pig"},
  {e:"🐸", w:"Frog"}, {e:"🦁", w:"Lion"}, {e:"🐘", w:"Elephant"}, {e:"🐵", w:"Monkey"},
  {e:"🐰", w:"Rabbit"}, {e:"🐥", w:"Chick"}
];
const FRUITS = ["🍎","🍌","🍇","🍓","🍊"];
const LETTERS = [
  {l:"A", w:"Apple", e:"🍎"}, {l:"B", w:"Bee", e:"🐝"}, {l:"C", w:"Cat", e:"🐱"},
  {l:"D", w:"Dog", e:"🐶"}, {l:"E", w:"Elephant", e:"🐘"}, {l:"F", w:"Frog", e:"🐸"},
  {l:"G", w:"Grapes", e:"🍇"}, {l:"H", w:"House", e:"🏠"}
];

const ROUTINE = [
  {e:"⏰", w:"Wake up", h:"जागना"},
  {e:"🪥", w:"Brush teeth", h:"दांत साफ़ करना"},
  {e:"🛁", w:"Take a bath", h:"नहाना"},
  {e:"👕", w:"Wear clothes", h:"कपड़े पहनना"},
  {e:"🍳", w:"Eat breakfast", h:"नाश्ता करना"},
  {e:"🎒", w:"Go to school", h:"स्कूल जाना"},
  {e:"🍱", w:"Eat lunch", h:"दोपहर का खाना खाना"},
  {e:"🎮", w:"Play", h:"खेलना"},
  {e:"📝", w:"Do homework", h:"होमवर्क करना"},
  {e:"🧼", w:"Wash hands", h:"हाथ धोना"},
  {e:"💧", w:"Drink water", h:"पानी पीना"},
  {e:"🌙", w:"Go to bed", h:"सोने जाना"},
  {e:"😴", w:"Sleep", h:"सोना"}
];

let mode = "animals", stars = 0, current = null, locked = false;
const $ = id => document.getElementById(id);

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a){ a = [...a]; for (let i = a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr, n, exclude){ return shuffle(arr.filter(x => x !== exclude)).slice(0, n); }

// Prefer a female voice (by name) in the requested language; falls back to any voice in that language.
function pickVoice(lang){
  const base = lang.slice(0, 2).toLowerCase();
  const list = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(base));
  return list.find(v => /female|woman|samantha|zira|heera|veena|kalpana|neerja|lekha|google/i.test(v.name)) || list[0] || null;
}
function speak(text, lang = "en-US", keep = false){
  if (!("speechSynthesis" in window)) return;
  if (!keep) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.85; u.pitch = 1.2;
  const v = pickVoice(lang);
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function makeRound(){
  if (mode === "animals"){
    const t = pick(ANIMALS);
    return {
      pic: t.e, picSay: t.w,
      prompt: "Find the " + t.w, say: "Find the " + t.w,
      choices: shuffle([t, ...sample(ANIMALS, 2, t)]).map(a => ({
        view: a.e, ok: a === t, say: a.w
      }))
    };
  }
  if (mode === "numbers"){
    const n = 1 + Math.floor(Math.random()*5);
    const fruit = pick(FRUITS);
    const nums = shuffle([1,2,3,4,5].filter(x => x !== n)).slice(0,2).concat(n);
    return {
      pic: fruit.repeat(n), picSay: n + (n === 1 ? " apple" : " apples"),
      prompt: "How many? Tap the number", say: "How many? Count them and tap the number",
      choices: shuffle(nums).map(k => ({view: String(k), ok: k === n, say: String(k)}))
    };
  }
  if (mode === "routine"){
    const t = pick(ROUTINE);
    return {
      pic: t.e, picSay: t.w,
      prompt: "What does \u201C" + t.w + "\u201D mean?",
      say: "What does " + t.w + " mean?",
      choices: shuffle([t, ...sample(ROUTINE, 2, t)]).map(x => ({
        view: x.h, ok: x === t, say: x.w
      })),
      reveal: t.w + " means " + t.h, hindi: t.h,
      hint: t.w + "  =  " + t.h
    };
  }
  // letters
  const t = pick(LETTERS);
  return {
    pic: t.e, picSay: t.w,
    prompt: t.w + " starts with which letter?", say: t.w + " starts with which letter?",
    choices: shuffle([t, ...sample(LETTERS, 2, t)]).map(x => ({
      view: x.l, ok: x === t, say: x.l
    })),
    reveal: t.w + " starts with " + t.l
  };
}

function render(){
  locked = false;
  current = makeRound();
  const pic = $("pic");
  pic.textContent = current.pic;
  $("prompt").textContent = current.prompt;
  $("msg").textContent = "";
  $("next").hidden = true;
  const box = $("choices");
  box.innerHTML = "";
  current.choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = c.view;
    if (mode === "routine") b.classList.add("txt");
    b.onclick = () => choose(b, c);
    box.appendChild(b);
  });
  speak(current.say);
}

function choose(btn, c){
  if (locked) return;
  if (c.ok){
    locked = true;
    btn.classList.add("right");
    stars++; $("score").textContent = stars;
    const praise = ["Great job!", "Well done!", "Super!", "Fantastic!"][stars % 4];
    $("msg").textContent = praise + " ⭐" + (current.hint ? "\n" + current.hint : "");
    speak(praise + " " + (current.reveal || ""));
    if (current.hindi) speak(current.hindi, "hi-IN", true);
    document.querySelectorAll(".choice").forEach(x => { if (x !== btn) x.disabled = true; });
    $("next").hidden = false;
  } else {
    btn.classList.add("wrong");
    btn.disabled = true;
    $("msg").textContent = "Try again! 🤗";
    speak("Try again");
  }
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    mode = t.dataset.mode;
    render();
  };
});
$("listen").onclick = () => speak(current.say);
$("pic").onclick = () => speak(current.picSay);
$("next").onclick = render;

render();
</script>
</body>
</html>
